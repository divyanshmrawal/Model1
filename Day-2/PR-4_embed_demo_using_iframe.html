<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Info - Fixed</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; background: #f4f4f4; text-align: center; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        iframe { width: 100%; height: 400px; border: none; border-radius: 5px; }
        h2 { color: #d32f2f; }
    </style>
</head>
<body>

    <h1>Silver Oak University</h1>

    <!-- FIXED VIDEO: Uses the proper /embed/ link -->
    <div class="card">
        <h2>University Campus Tour</h2>
        <iframe 
            src="https://www.youtube.com/embed/zjFI0Yd5700" 
            allowfullscreen>
        </iframe>
    </div>

    <!-- FIXED MAP: Uses a direct search-based embed to avoid 'pb' errors -->
    <div class="card">
        <h2>Our Location</h2>
        <iframe 
            src="https://maps.google.com/maps?q=Silver%20Oak%20University%20Ahmedabad&t=&z=15&ie=UTF8&iwloc=&output=embed" 
            allowfullscreen>
        </iframe>
    </div>

</body>
</html>
