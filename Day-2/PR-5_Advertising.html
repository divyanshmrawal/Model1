<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUMA // Forever Faster</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --puma-red: #ba2026;
            --puma-black: #101010;
            --puma-white: #ffffff;
            --puma-grey: #252525;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--puma-black);
            color: var(--puma-white);
            line-height: 1.6;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background: rgba(16, 16, 16, 0.9);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo { font-weight: 900; font-size: 1.5rem; letter-spacing: 2px; }

        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 80px 5%;
        }

        .hero h1 {
            font-size: clamp(2.5rem, 8vw, 5rem);
            font-weight: 900;
            text-transform: uppercase;
            font-style: italic;
            margin-bottom: 10px;
        }

        .section-title {
            text-align: center;
            font-size: 2rem;
            text-transform: uppercase;
            margin: 40px 0 20px;
            color: var(--puma-red);
        }

        /* Container for Video and Map */
        .content-box {
            width: 90%;
            max-width: 900px;
            margin: 20px auto 60px;
            aspect-ratio: 16 / 9;
            border: 2px solid var(--puma-grey);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(186, 32, 38, 0.2);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .cta-button {
            background-color: var(--puma-white);
            color: var(--puma-black);
            padding: 15px 40px;
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 4px;
            transition: 0.3s;
        }

        .cta-button:hover {
            background-color: var(--puma-red);
            color: white;
        }

        footer { text-align: center; padding: 40px; color: #555; font-size: 0.8rem; border-top: 1px solid var(--puma-grey); }
    </style>
</head>
<body>

    <nav>
        <div class="logo">PUMA</div>
        <a href="#" class="cta-button" style="padding: 10px 20px;">Shop Now</a>
    </nav>

    <header class="hero">
        <h1>NITRO <span style="color: var(--puma-red);">UNLEASHED</span></h1>
        <p style="color: #aaa; margin-bottom: 30px;">Push the limits of speed with the all-new Nitro series.</p>
    </header>

    <!-- VIDEO SECTION -->
    <h2 class="section-title">The Reveal</h2>
    <div class="content-box">
        <iframe 
            src="https://www.youtube.com/embed/zwW6Jp0ZtJw?autoplay=1&mute=1&loop=1&playlist=zwW6Jp0ZtJw" 
            title="Puma Video" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
        </iframe>
    </div>

    <!-- MAP SECTION -->
    <h2 class="section-title">Visit Us in Ahmedabad</h2>
    <p style="text-align: center; margin-bottom: 20px;">Alpha One Mall, Vastrapur</p>
    <div class="content-box">
        <iframe 
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3671.697920191838!2d72.53856237588301!3d23.0348700155263!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x395e84b7366ae235%3A0x103b47712026eb63!2sPUMA%20Store!5e0!3m2!1sen!2sin!4v1710000000000!5m2!1sen!2sin" 
            allowfullscreen="" 
            loading="lazy" 
            referrerpolicy="no-referrer-when-downgrade">
        </iframe>
    </div>

    <div style="text-align: center; margin-bottom: 80px;">
        <a href="#" class="cta-button">Find More Stores</a>
    </div>

    <footer>
        <p>&copy; 2026 PUMA. FOREVER FASTER.</p>
    </footer>

</body>
</html>
